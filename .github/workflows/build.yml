name: Zostav appku Lóra

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rozbaľ projekt
        run: unzip -q lora-zdroj.zip -d build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Zostav APK
        working-directory: build/lora-app
        run: |
          npm ci
          npx cap sync android
          mkdir -p ~/.android
          cp lora-debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/lora.apk"

      - name: Zverejni na stiahnutie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lóra ${{ github.run_number }}
          files: lora.apk
          make_latest: true
